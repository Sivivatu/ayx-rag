[project]
name = "page-downloader"
version = "0.1.0"
description = "Download raw HTML pages from URLs for RAG pipeline content collection"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2025.10.5",
    "httpx>=0.25.0",
    "typer>=0.20.0",
    "loguru>=0.7.3",
    "rich>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
