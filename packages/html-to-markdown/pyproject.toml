[project]
name = "html-to-markdown"
version = "0.1.0"
description = "Convert Alteryx help HTML to Markdown with evaluation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "docling>=2.61.2,<3.0.0",
    "markdownify>=0.13.0",
    "pypandoc>=1.13",
]

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
