[project]
name = "uv-ayx-rag"
version = "0.1.0"
description = "RAG (Retrieval Augmented Generation) system for Alteryx help documentation"
requires-python = ">=3.10"
dependencies = [
    "sitemap-filter",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sitemap-filter = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
