[project]
name = "uv-ayx-rag"
version = "0.1.0"
description = "RAG (Retrieval Augmented Generation) system for Alteryx help documentation"
requires-python = ">=3.10"
dependencies = [
    "sitemap-filter",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sitemap-filter = { workspace = true, editable = true }

[dependency-groups]
dev = []
