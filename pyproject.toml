[project]
name = "uv-ayx-rag"
version = "0.1.0"
description = "RAG (Retrieval Augmented Generation) system for Alteryx help documentation"
requires-python = ">=3.10"
dependencies = [
    "sitemap-filter",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sitemap-filter = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]

[tool.ruff]
# Set the maximum line length
line-length = 100
target-version = "py310"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable commonly used rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Function calls in argument defaults (required by Typer)
    "B904", # Exception chaining (Typer.Exit doesn't support chaining)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"**/parser.py" = ["N806"]  # Allow uppercase constants in functions

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Use Unix-style line endings
line-ending = "lf"
